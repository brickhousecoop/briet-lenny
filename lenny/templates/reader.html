{% extends "base.html" %}
{% block title %}Reading: {{ book.title }} — BRIET Digital Lending{% endblock %}

{% block content %}
<section class="reader-page">
    <div class="reader-toolbar">
        <div class="reader-info">
            <strong>{{ book.title }}</strong>
            <span class="reader-author">by {{ book.author }}</span>
        </div>
        <div class="reader-actions">
            <a href="/shelf" class="btn btn-small btn-outline">Back to Shelf</a>
            <form method="POST" action="/catalog/{{ book.id }}/return" style="display:inline">
                <button type="submit" class="btn btn-small btn-outline">Return Book</button>
            </form>
        </div>
    </div>

    <div class="reader-container">
        <embed
            src="/books/{{ book.id }}/download"
            type="application/pdf"
            width="100%"
            height="100%"
        >
        <noscript>
            <p>
                Your browser does not support embedded PDFs.
                <a href="/books/{{ book.id }}/download">Download the PDF</a> instead.
            </p>
        </noscript>
    </div>
</section>
{% endblock %}
